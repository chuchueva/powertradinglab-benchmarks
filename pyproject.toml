[project]
name = "trading-lab-benchmark-core"
version = "0.1.0"
description = "Daily trading benchmarks for European short-term power markets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
# Only the project's own tests. private/ holds example code from other
# projects, with test_*.py files of its own that need packages we do not have.
testpaths = ["tests"]
